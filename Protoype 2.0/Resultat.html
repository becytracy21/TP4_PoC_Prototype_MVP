<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accueil</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="Accueil.html">YRR - Protoype</a>
      <nav aria-label="Navigation principale">
        <ul class="main-nav">
          <li><a href="Accueil.html">Home</a></li>
          <li><a href="Boat.html">Boat</a></li>
          <li><a href="Classe.html">Classes</a></li>
          <li><a href="Entry.html">Entry</a></li>
          <li><a href="Race.html">Race</a></li>
          <li><a href="Series.html" class="active">Serie</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
      </div>

        <!-- Profil affiché quand l'utilisateur est connecté -->
        <!-- Remplacer ou masquer selon l'état de session -->
        <div class="header-actions" style="margin-left:8px">
            <a href="Profil.html"><div class="avatar" title="Profil">JD</div></a>
            <a href="Profil.html"><div class="username">John Doe</div></a>   
            <button id="logoutBtn" class="btn btn-outline-secondary btn-sm" type="button" style="margin-left:10px">Se déconnecter</button>
        </div>
      </div>

    </div>
  </header>

  <main class="container" role="main">
    <h1>Bienvenue</h1>
    <p>Utilisez le menu en haut pour naviguer entre les pages Boat, Entry, Race, Resultat et Serie.</p>
  </main>
  <script>
    (function(){
      var btn = document.getElementById('logoutBtn');
      if(!btn) return;
      btn.addEventListener('click', function(){
        if(!confirm('Voulez-vous vraiment vous déconnecter ?')) return;
        try{ localStorage.removeItem('yrr_session_v1'); localStorage.removeItem('yrr_profile_v1'); }catch(e){}
        window.location.href = 'Connexion.html';
      });
    })();
  </script>
</body>
</html>
