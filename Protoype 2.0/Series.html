<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Séries</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Styles pour le menu profil */
    .profile-toggle { background:none; border:0; padding:0; display:inline-flex; align-items:center; gap:8px; cursor:pointer; color:inherit; }
    .profile-toggle:focus { outline:2px solid rgba(0,123,255,0.25); border-radius:4px; }
    .profile-toggle .avatar { width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:#333; color:#fff; font-weight:600; }
    .profile-toggle .username { font-size:0.95rem; }
    .profile-menu { position:relative; display:inline-block; }
    .profile-dropdown { position:absolute; right:0; top:calc(100% + 8px); background:#fff; border:1px solid #ddd; box-shadow:0 6px 18px rgba(0,0,0,0.08); min-width:160px; border-radius:6px; z-index:1000; }
    .profile-dropdown[hidden] { display:none; }
    .profile-dropdown .menu-item { display:block; width:100%; padding:8px 12px; text-align:left; background:none; border:0; color:#222; text-decoration:none; cursor:pointer; }
    .profile-dropdown .menu-item:hover, .profile-dropdown .menu-item:focus { background:#f5f7fa; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="Accueil.html">YRR - Protoype</a>
      <nav aria-label="Navigation principale">
        <ul class="main-nav">
          <li><a href="Accueil.html">Home</a></li>
          <li><a href="Boat.html">Boat</a></li>
          <li><a href="Classe.html">Classes</a></li>
          <li><a href="Entry.html">Entry</a></li>
          <li><a href="Race.html">Race</a></li>
          <li><a href="Series.html" class="active">Serie</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
      </div>

        <!-- Profil affiché quand l'utilisateur est connecté -->
        <!-- Remplacer ou masquer selon l'état de session -->
        <div class="header-actions profile-menu" style="margin-left:8px;">
            <div class="profile-menu-inner" style="display:inline-block;">
              <button id="profileToggle" class="profile-toggle" aria-haspopup="true" aria-expanded="false" title="Profil">
                <div class="avatar">JD</div>
                <div class="username">John Doe</div>
              </button>
              <div id="profileDropdown" class="profile-dropdown" role="menu" aria-label="Menu profil" hidden>
                <a class="menu-item" href="Profil.html" role="menuitem">Mon Profil</a>
                <button id="logoutMenuBtn" class="menu-item" type="button" role="menuitem">Se déconnecter</button>
              </div>
            </div>
        </div>
      </div>

    </div>
  </header>

  <main class="container" role="main">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <h1 style="margin:0">Séries <span class="title-status" id="seriesStatus"></span></h1>
      <div>
        <a href="Resultat.html"><button id="resultsBtn" class="btn btn-primary">Results</button></a>
      </div>
    </div>
    <br/>

    <div class="classes-table-wrap" data-scroll="true">
      <table class="classes-table" aria-label="Tableau des séries" id="seriesTable">
        <thead>
          <tr>
            <th>Nom de la série</th>
            <th>OD/H</th>
            <th>Classe</th>
            <th>#Courses</th>
            <th>#Courses à comptabiliser</th>
            <th class="action-cell"></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Summer Cup</td>
            <td>OD</td>
            <td>Laser</td>
            <td>5</td>
            <td>4</td>
            <td class="action-cell"><button class="btn-delete">Supprimer</button></td>
          </tr>
          <tr>
            <td>Autumn Regatta</td>
            <td>H</td>
            <td>TS-240</td>
            <td>6</td>
            <td>5</td>
            <td class="action-cell"><button class="btn-delete">Supprimer</button></td>
          </tr>
          <tr>
            <td>Club Series</td>
            <td>OD</td>
            <td>Solo</td>
            <td>4</td>
            <td>3</td>
            <td class="action-cell"><button class="btn-delete">Supprimer</button></td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

</body>
</html>
