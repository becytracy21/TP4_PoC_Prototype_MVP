<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Courses</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="Accueil.html">YRR - Protoype</a>
      <nav aria-label="Navigation principale">
        <ul class="main-nav">
          <li><a href="Accueil.html">Home</a></li>
          <li><a href="Boat.html">Boat</a></li>
          <li><a href="Classe.html">Classes</a></li>
          <li><a href="Entry.html">Entry</a></li>
          <li><a href="Race.html">Race</a></li>
          <li><a href="Series.html" class="active">Serie</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
      </div>

        <!-- Profil affiché quand l'utilisateur est connecté -->
        <!-- Remplacer ou masquer selon l'état de session -->
        <div class="header-actions profile-menu" style="margin-left:8px;">
            <div class="profile-menu-inner" style="display:inline-block;">
              <button id="profileToggle" class="profile-toggle" aria-haspopup="true" aria-expanded="false" title="Profil">
                <div class="avatar">JD</div>
                <div class="username">John Doe</div>
              </button>
              <div id="profileDropdown" class="profile-dropdown" role="menu" aria-label="Menu profil" hidden>
                <a class="menu-item" href="Profil.html" role="menuitem">Mon Profil</a>
                <button id="logoutMenuBtn" class="menu-item" type="button" role="menuitem">Se déconnecter</button>
              </div>
            </div>
        </div>
      </div>

    </div>
  </header>

  <main class="container" role="main">
    <h1>Courses <select id="seriesSelector" class="title-select"><option value="none">Courses hors série</option><option value="seriesA">Série A</option><option value="seriesB">Série B</option></select></h1>

    <table class="boat-table" id="raceTable" aria-label="Tableau des courses">
      <thead>
        <tr>
          <th>OD/H</th>
          <th>Classe de course</th>
          <th>Date</th>
          <th>Heure de départ</th>
          <th>Nom de la course</th>
          <th>Parcours</th>
        </tr>
      </thead>
      <tbody>
        <!-- Exemples hors série -->
        <tr data-series="none">
          <td><input class="cell-input small" data-field="od" value="Monotype"></td>
          <td><input class="cell-input small" data-field="class" value="FM"></td>
          <td><input class="cell-input" data-field="date" type="date" value="2026-04-10"></td>
          <td><input class="cell-input small" data-field="time" type="time" value="10:30"></td>
          <td><input class="cell-input" data-field="name" value="Regate Matinale"></td>
          <td><input class="cell-input small" data-field="course" value="Parcours A"></td>
        </tr>
        <tr data-series="none">
          <td><input class="cell-input small" data-field="od" value="Handicap"></td>
          <td><input class="cell-input small" data-field="class" value="Open"></td>
          <td><input class="cell-input" data-field="date" type="date" value="2026-04-10"></td>
          <td><input class="cell-input small" data-field="time" type="time" value="14:00"></td>
          <td><input class="cell-input" data-field="name" value="Course Après-midi"></td>
          <td><input class="cell-input small" data-field="course" value="Parcours B"></td>
        </tr>
      </tbody>
    </table>

  </main>

  <script src="js/race.js" defer></script>
</body>
</html>
