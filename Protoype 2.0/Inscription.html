<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inscription</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- inline styles moved to css/style.css -->
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="Accueil.html">YRR - Protoype</a>
    </div>
  </header>

  <main class="container" role="main">
    <div class="signup-wrap">
      <div class="signup-header">
        <h2>Créer un compte</h2>
        <p class="small-muted">Remplissez le formulaire ci‑dessous ou utilisez un réseau social.</p>
      </div>

      <div>
        <label class="field"><span>Nom complet</span><input id="fullName" type="text" placeholder="Prénom Nom" /></label>
        <label class="field"><span>Nom d'utilisateur</span><input id="username" type="text" placeholder="nom_utilisateur" /></label>
        <label class="field"><span>Adresse e‑mail</span><input id="email" type="email" placeholder="vous@exemple.com" /></label>
        <label class="field"><span>Mot de passe</span><input id="password" type="password" placeholder="••••••••" /></label>
        <label class="field"><span>Confirmer le mot de passe</span><input id="passwordConfirm" type="password" placeholder="Confirmer" /></label>

        <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
          <button id="signupBtn" class="btn btn-primary" type="button">S'inscrire</button>
          <button class="btn btn-outline" type="button" onclick="window.location.href='Connexion.html'">Annuler</button>
        </div>
      </div>
    </div>
  </main>

  <!-- external script: moved from inline to js/inscription.js -->
  <script src="js/inscription.js" defer></script>
</body>
</html>
