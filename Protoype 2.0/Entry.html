<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inscriptions</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="Accueil.html">YRR - Protoype</a>
      <nav aria-label="Navigation principale">
        <ul class="main-nav">
          <li><a href="Accueil.html">Home</a></li>
          <li><a href="Boat.html">Boat</a></li>
          <li><a href="Classe.html">Classes</a></li>
          <li><a href="Entry.html" class="active">Entry</a></li>
          <li><a href="Race.html">Race</a></li>
          <li><a href="Series.html">Serie</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <div class="header-actions">
        </div>

        <!-- Profil affiché quand l'utilisateur est connecté (menu déroulant) -->
        <div class="header-actions profile-menu" style="margin-left:8px;">
            <div class="profile-menu-inner" style="display:inline-block;">
              <button id="profileToggle" class="profile-toggle" aria-haspopup="true" aria-expanded="false" title="Profil">
                <div class="avatar">JD</div>
                <div class="username">John Doe</div>
              </button>
              <div id="profileDropdown" class="profile-dropdown" role="menu" aria-label="Menu profil" hidden>
                <a class="menu-item" href="Profil.html" role="menuitem">Mon Profil</a>
                <button id="logoutMenuBtn" class="menu-item" type="button" role="menuitem">Se déconnecter</button>
              </div>
            </div>
        </div>
      </div>

    </div>
  </header>

  <main class="container" role="main">
    <!-- Controls: Previous / Title / Next -->
    <div class="controls" aria-hidden="false">
      <div style="display:flex;align-items:center;gap:8px;">
        <button id="prevRace" class="btn">&laquo; Précédent</button>
        <button id="nextRace" class="btn">Suivant &raquo;</button>
      </div>
      <div style="margin-left:16px;">
        <h1 id="entryTitle">Inscriptions</h1>
        <div class="title-status" id="entrySubtitle"></div>
      </div>
    </div>

    <!-- Actions: ajouter une inscription -->
    <div class="controls" style="margin-top:12px;">
      <details id="addEntry" class="add-details">
        <summary class="add-summary">+ Ajouter une inscription</summary>
        <form id="addEntryForm" class="add-form" onsubmit="return false;">
          <div class="row">
            <label for="entryBoatName">Nom du bateau</label>
            <input id="entryBoatName" type="text" required />
          </div>
          <div class="row" style="margin-top:8px">
            <label for="entryBoatClass">Classe</label>
            <select id="entryBoatClass">
              <option value="">-- Sélectionner --</option>
              <option value="Laser">Laser</option>
              <option value="Solo">Solo</option>
              <option value="Albacore">Albacore</option>
              <option value="TS-240">TS-240</option>
              <option value="Wanderer">Wanderer</option>
            </select>
          </div>
          <div class="row" style="margin-top:8px">
            <label for="entrySail">Numéro de voile</label>
            <input id="entrySail" type="text" placeholder="ex: 101" />
          </div>
          <div class="row" style="margin-top:8px">
            <label for="entryHelm">Barreur</label>
            <input id="entryHelm" type="text" placeholder="Nom du barreur" />
          </div>
          <div class="row" style="margin-top:8px">
            <label for="entryResult">Résultat</label>
            <input id="entryResult" type="text" placeholder="ex: 01:23:45 ou DNS" />
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="addEntrySubmit">Ajouter</button>
            <button class="btn btn-outline" type="button" onclick="document.getElementById('addEntry').removeAttribute('open')">Annuler</button>
          </div>
        </form>
      </details>
      <div class="small-muted">Les colonnes Position et Points sont calculées automatiquement.</div>
    </div>

    <!-- Table des inscriptions -->
    <div class="classes-table-wrap" data-scroll="true">
      <table class="classes-table" id="entriesTable" aria-label="Table des inscriptions">
        <thead>
          <tr>
            <th>Nom du bateau</th>
            <th>Classe de bateau</th>
            <th>Numéro de voile</th>
            <th>Barreur</th>
            <th>Résultat</th>
            <th>Position</th>
            <th>Points</th>
            <th class="action-cell"></th>
          </tr>
        </thead>
        <tbody>
          <!-- Lignes générées dynamiquement par js/entry.js -->
        </tbody>
      </table>
    </div>

    <div id="message" class="small-muted" style="margin-top:12px;"></div>
  </main>

  <script src="js/entry.js" defer></script>
</body>
</html>
