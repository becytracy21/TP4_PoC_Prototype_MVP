<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profil</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css" />
  <!-- inline profile styles removed and consolidated into css/style.css -->
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="Accueil.html">YRR - Protoype</a>
      <nav aria-label="Navigation principale">
        <ul class="main-nav">
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
        </ul>
      </nav>

      <div class="nav-actions"></div>
      <div class="header-actions" style="margin-left:8px">
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm" type="button" style="margin-left:10px">Se déconnecter</button>
      </div>
    </div>
  </header>

  <main class="container mt-4">
    <div class="row">
      <div class="col-lg-10 offset-lg-1">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="row">
              <div class="col-md-4 profile-user-box text-center">
                <div id="avatarPreview" class="avatar mb-3" title="Profil">JD</div>
                <div id="profileNames" class="mb-2">
                  <div id="displayFullName" class="h5 mb-0">John Doe</div>
                  <div id="displayUsername" class="text-muted">@jdupont</div>
                </div>
                <div>
                  <label class="btn btn-sm btn-primary" for="avatarInput">Changer la photo</label>
                  <input id="avatarInput" type="file" accept="image/*" style="display:none">
                  <button id="removeAvatar" class="btn btn-sm btn-danger">Supprimer</button>
                </div>
              </div>

              <div class="col-md-8">
                <h4 class="mb-3">Modifier le profil</h4>
                <form id="profileForm" class="profile-form" onsubmit="return false;">
                  <div class="form-row">
                    <div class="form-group col-md-6">
                      <label for="fullName">Nom complet</label>
                      <input id="fullName" class="form-control" type="text" placeholder="Ex : Jean Dupont">
                    </div>
                    <div class="form-group col-md-6">
                      <label for="username">Nom d'utilisateur</label>
                      <input id="username" class="form-control" type="text" placeholder="Ex : jdupont">
                    </div>
                  </div>

                  <div class="form-row">
                    <div class="form-group col-md-6">
                      <label for="email">Email</label>
                      <input id="email" class="form-control" type="email" placeholder="exemple@domaine.com">
                    </div>
                    <div class="form-group col-md-6">
                      <label for="phone">Téléphone</label>
                      <input id="phone" class="form-control" type="tel" placeholder="(514) 444-1234">
                    </div>
                  </div>

                  <div class="form-group d-flex align-items-center">
                    <button id="saveProfile" class="btn btn-success" type="button">Enregistrer</button>
                    <button id="cancelProfile" class="btn btn-danger" type="button">Annuler</button>
                  </div>
                </form>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- moved inline scripts into js/profit.js -->
  <script src="js/profit.js" defer></script>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
