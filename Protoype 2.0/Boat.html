<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bateaux</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- profile menu styles moved to css/style.css -->
 </head>
 <body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="Accueil.html">YRR - Protoype</a>
      <nav aria-label="Navigation principale">
        <ul class="main-nav">
          <li><a href="Accueil.html">Home</a></li>
          <li><a href="Boat.html">Boat</a></li>
          <li><a href="Classe.html">Classes</a></li>
          <li><a href="Entry.html">Entry</a></li>
          <li><a href="Race.html">Race</a></li>
          <li><a href="Series.html" class="active">Serie</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <div class="header-actions">
        </div>

        <!-- Profil affiché quand l'utilisateur est connecté (menu déroulant) -->
        <div class="header-actions profile-menu" style="margin-left:8px;">
          <div class="profile-menu-inner" style="display:inline-block;">
            <button id="profileToggle" class="profile-toggle" aria-haspopup="true" aria-expanded="false" title="Profil">
              <div class="avatar">JD</div>
              <div class="username">John Doe</div>
            </button>
            <div id="profileDropdown" class="profile-dropdown" role="menu" aria-label="Menu profil" hidden>
              <a class="menu-item" href="Profil.html" role="menuitem">Mon Profil</a>
              <button id="logoutMenuBtn" class="menu-item" type="button" role="menuitem">Se déconnecter</button>
            </div>
          </div>
        </div>

      </div>

    </div>
  </header>

  <main class="container" role="main">
    <h1>Liste des bateaux</h1>

    <div class="add-boat-wrap">
      <details id="addBoat" class="add-details">
        <summary class="add-summary">+ Ajouter un bateau</summary>
        <form id="addBoatForm" class="add-form" onsubmit="return false;">
          <div class="row">
            <label for="boatName">Nom du bateau</label>
            <input id="boatName" type="text" required />
          </div>
          <div class="row" style="margin-top:8px">
            <label for="boatClass">Classe</label>
            <select id="boatClass">
              <option value="">-- Sélectionner --</option>
              <option value="Laser">Laser</option>
              <option value="Solo">Solo</option>
              <option value="Albacore">Albacore</option>
              <option value="TS-240">TS-240</option>
              <option value="Wanderer">Wanderer</option>
            </select>
          </div>
          <div class="row" style="margin-top:8px">
            <label for="boatSail">Numéro de voile</label>
            <input id="boatSail" type="text" placeholder="ex: 101" />
          </div>
          <div class="row" style="margin-top:8px">
            <label for="boatHelm">Barreur</label>
            <input id="boatHelm" type="text" placeholder="Nom du barreur" />
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="addBoatBtn">Ajouter</button>
            <button class="btn btn-outline" type="button" onclick="document.getElementById('addBoat').removeAttribute('open')">Annuler</button>
          </div>
        </form>
      </details>
    </div>

  <br/>
    <div class="classes-table-wrap" data-scroll="true">
      <table class="classes-table" aria-label="Tableau des bateaux" id="boatTable">
        <thead>
          <tr>
            <th>Nom du bateau</th>
            <th>Classe</th>
            <th>Numéro de voile</th>
            <th>Barreur</th>
            <th class="action-cell"></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Sea Breeze</td>
            <td>Laser</td>
            <td>101</td>
            <td>Alice</td>
            <td class="action-cell"><button class="btn-delete">Supprimer</button></td>
          </tr>
          <tr>
            <td>Wind Rider</td>
            <td>Solo</td>
            <td>102</td>
            <td>Bob</td>
            <td class="action-cell"><button class="btn-delete">Supprimer</button></td>
          </tr>
          <tr>
            <td>Blue Horizon</td>
            <td>Albacore</td>
            <td>103</td>
            <td>Charlie</td>
            <td class="action-cell"><button class="btn-delete">Supprimer</button></td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>


 </body>
 </html>
