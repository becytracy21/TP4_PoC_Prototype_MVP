<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accueil</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="Accueil.html">YRR - Protoype</a>
      <nav aria-label="Navigation principale">
        <ul class="main-nav">
          <li><a href="Accueil.html">Home</a></li>
          <li><a href="Boat.html">Boat</a></li>
          <li><a href="Classe.html">Classes</a></li>

      </div>

    <h1>Bienvenue</h1>
    <p>Utilisez le menu en haut pour naviguer entre les pages Boat, Entry, Race, Resultat et Serie.</p>
