services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./yrr_mvp/backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/
      - MONGODB_DB=yrr_mvp
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./yrr_mvp/frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
